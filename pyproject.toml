[tool.poetry]
name = "django-lexorank"
version = "0.1.4"
description = "This package implements an algorithm similar to JIRA's lexorank, but without using buckets for rebalancing that can be used with Django projects."
authors = ["Alex Rozum <rozumalex@gmail.com>"]
packages = [{ include = "django_lexorank" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
readme = "README.md"

[tool.poetry.urls]
"Homepage" = "https://github.com/rozumdev/django-lexorank/"
"Bug Tracker" = "https://github.com/rozumdev/django-lexorank/issues/"

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest-django = "^4.5.2"
factory-boy = "^3.3.0"
django-extensions = "^3.2.3"
pre-commit = "^3.3.3"
bpython = "^0.24"
tox = "^4.6.4"

[tool.isort]
profile = "black"

[tool.flake8]
max-complexity = 15
max-line-length = 88
per-file-ignores = ["__init__.py: F401"]

[tool.mypy]
allow_untyped_globals = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = "tests"

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        django6.0-{py312,py313}

    [gh-actions]
    python =
        3.12: py312
        3.13: py313

    [testenv]
    deps =
        django6.0: Django>=6.0,<6.1
        pytest
        pytest-django
        factory-boy
        django-extensions
    commands =
        pytest
    setenv =
        PYTHONPATH=.
"""

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
